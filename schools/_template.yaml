# School registry template. Copy to schools/{slug}.yaml and fill in.
slug: example-u
display_name: Example University
canvas_base_url: https://canvas.example.edu
sso_idp: https://idp.example.edu/idp/shibboleth
timezone: America/New_York
term_dates:
  fall_start: "2026-08-24"
  fall_end: "2026-12-18"
  spring_start: "2027-01-12"
  spring_end: "2027-05-08"
lti_catalog:
  - gradescope
  - zybooks
  - webassign
  - mylab
  - piazza
  - perusall
engagement_platform: null
# Optional: map Canvas course name patterns → inbox course file codes
course_file_map: []
# Letter → quality points for local GPA estimates. Omit to use US 4.0 default in gpa.py.
grade_scale:
  A+: 4.0
  A: 4.0
  A-: 3.7
  B+: 3.3
  B: 3.0
  B-: 2.7
  C+: 2.3
  C: 2.0
  C-: 1.7
  D+: 1.3
  D: 1.0
  D-: 0.7
  F: 0.0
# Official policy URLs agents may cite (never scrape Buff Portal / SIS).
policy_links:
  degree_audit: ""
  registration_holds: ""
  preregistration: ""
  credits_grading: ""
  sap: ""
  scholarships: ""
  advising: ""
# Shown in onboarding before SSO (multiline string)
legal_notice: |
  ProductName is local-first. Data stays on this device. You are responsible for
  following your school's academic integrity and acceptable-use policies.
# Example:
# course_file_map:
#   - code: CSCI1000
#     patterns: ["csci\\s*1000"]
